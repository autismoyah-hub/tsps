[package]
name = "gielinor-client"
version = "0.1.0"
edition = "2021"
description = "OSRS 239 client port in progress; native protocol and cache foundation"
publish = false

[features]
default = []
custom-assets = []
native-profiling = []
enhanced-renderer = ["dep:windows"]
private-test-adapter = ["custom-assets"]
offscreen = ["private-test-adapter"]

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
optional = true
features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"]

[dependencies]
miniz_oxide = { path = "vendor/miniz_oxide-0.8.9" }
libbz2-rs-sys = { path = "vendor/libbz2-rs-sys-0.2.2", default-features = false, features = ["std"] }
num-bigint = { path = "vendor/num-bigint-0.4.6" }
getrandom = { path = "vendor/getrandom-0.2.16", features = ["std"] }
sha2 = { path = "vendor/sha2-0.10.8", features = ["force-soft"] }
libm = { path = "vendor/libm-0.2.15", default-features = false }
lewton = { path = "vendor/lewton-0.10.2", default-features = false }

[profile.release]
overflow-checks = true

[[bin]]
name = "terrain-native-test"
path = "src/bin/terrain-native-test.rs"
required-features = ["custom-assets","enhanced-renderer","private-test-adapter"]


[[bin]]
name = "authored-live"
path = "src/bin/authored-live.rs"
required-features = ["custom-assets"]

[[bin]]
name = "private-authored-test"
path = "src/bin/private-authored-test.rs"
required-features = ["private-test-adapter"]

[[bin]]
name = "profiled-authored-live"
path = "src/bin/profiled-authored-live.rs"
required-features = ["custom-assets", "native-profiling"]

[[bin]]
name = "enhanced-authored-live"
path = "src/bin/enhanced-authored-live.rs"
required-features = ["enhanced-renderer", "custom-assets"]

[[bin]]
name = "profiled-enhanced-authored-live"
path = "src/bin/profiled-enhanced-authored-live.rs"
required-features = ["enhanced-renderer", "custom-assets", "native-profiling"]

[[bin]]
name = "enhanced-private-authored-test"
path = "src/bin/enhanced-private-authored-test.rs"
required-features = ["enhanced-renderer", "private-test-adapter"]

[[bin]]
name = "profiled-terrain-live"
path = "src/bin/profiled-terrain-live.rs"
required-features = ["enhanced-renderer", "custom-assets", "native-profiling"]

[[bin]]
name = "private-authored-test-offscreen"
path = "src/bin/private-authored-test-offscreen.rs"
required-features = ["offscreen"]
