[package]
name="tinyvec"
version="1.10.0"
edition="2018"
build=false
[lib]
path="src/lib.rs"
[features]
default = []
alloc = ["tinyvec_macros"]
std = ["alloc"]
rustc_1_40 = []
rustc_1_55 = []
rustc_1_57 = []
rustc_1_61 = ["rustc_1_57"]
latest_stable_rust = ["rustc_1_61"]
[dependencies.tinyvec_macros]
path = "../tinyvec_macros-0.1.1"
optional = true

[lints.rust]
unexpected_cfgs="allow"
deprecated="allow"
